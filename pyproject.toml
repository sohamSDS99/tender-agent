[project]
name = "tender-agent"
version = "0.1.0"
description = "AI Tender Applying Agent — autonomous tender discovery, evaluation, drafting, and submission"
requires-python = ">=3.11"

dependencies = [
    # === Orchestration ===
    "langgraph>=0.4.0,<1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0,<3.0.0",

    # === LLM ===
    "openai>=1.60.0",

    # === Embeddings ===
    "voyageai>=0.3.0,<1.0.0",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",

    # === Document Parsing ===
    # `unstructured[pdf]` pulls pypdf/pdfminer.six as transitive deps today,
    # but the bridge has direct top-level imports of pypdf / reportlab /
    # openpyxl in form_writer.py + form_parser.py + nexus_bridge.py. Pinning
    # them here means a future unstructured release that drops or relocates
    # those won't silently break PDF/XLSX fill in production.
    "unstructured[pdf]>=0.16.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "pypdf>=4.0.0,<6.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "openpyxl>=3.1.0,<4.0.0",

    # === Slack ===
    "slack-bolt>=1.20.0,<2.0.0",

    # === Browser Automation ===
    "playwright>=1.48.0,<2.0.0",

    # === Web Scraping & HTTP ===
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "feedparser>=6.0.0,<7.0.0",

    # === Scheduling ===
    "apscheduler>=3.10.0,<4.0.0",

    # === Monitoring ===
    "langsmith>=0.2.0,<1.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",

    # === Utilities ===
    "pydantic>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=24.1.0",
    "jinja2>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true